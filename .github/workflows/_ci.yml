name: CI

# Reusable lint/test matrix. Called by pr.yml, main.yml and release.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-web:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Build SPA
        working-directory: web
        run: vp install && vp build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          # dist/.vite/manifest.json is read by the Go server; keep hidden files.
          include-hidden-files: true
          retention-days: 1

  lint-fe:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Format + lint + typecheck
        working-directory: web
        run: vp install && vp check

  lint-be:
    name: Lint backend
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test-unit:
    name: Test backend
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -cover ./...

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - name: Vitest
        working-directory: web
        run: vp install && vp test

  test-e2e:
    name: Test E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - working-directory: web
        run: vp install
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        run: vp run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
