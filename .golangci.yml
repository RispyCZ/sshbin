version: "2"

run:
  timeout: 5m

linters:
  # Pins exactly these five. (Today this equals v2's implicit `standard`
  # default, so you could also just delete `default` + `enable` entirely.)
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      # Type-aware ignores for intentional cleanup/shutdown paths.
      # Replaces the old broad `source: (\.Write|\.Shutdown|\.Rollback)` regex.
      exclude-functions:
        - (*database/sql.Tx).Rollback
        - (*net/http.Server).Shutdown

  exclusions:
    # Warn if any rule below stops matching anything.
    warn-unused: true
    presets:
      # Classic false positives: unchecked Close/Flush/print/os.Setenv/etc.
      - std-error-handling
    rules:
      # Tests routinely ignore setup errors; keep errcheck for prod code only.
      - path: '_test\.go'
        linters:
          - errcheck